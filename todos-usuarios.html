    <div class="content">
      <div class="card-panel">
        <div style="padding:12px 18px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
          <input type="text" id="filter-search" placeholder="🔍 Buscar usuário ou criador..." style="min-width:200px; max-width:240px; flex-shrink:0; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:13px; padding:7px 12px; outline:none;">
          <select id="filter-status" style="min-width:150px; flex-shrink:0; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:13px; padding:7px 12px; outline:none;">
            <option value="">Todos os status</option>
            <option value="online">Online</option>
            <option value="active">Ativos</option>
            <option value="expired">Expirados</option>
            <option value="blocked">Bloqueados</option>
          </select>
          <button class="btn btn-ghost btn-sm" style="flex-shrink:0; white-space:nowrap;" onclick="loadAll()">↻ Atualizar</button>
          <span class="text-muted" id="user-count" style="margin-left:auto; font-size:12px; flex-shrink:0;">–</span>
        </div>
      </div>

      <div class="card-panel" style="flex-shrink:0;">
        <div class="table-wrap">
          <table id="users-table">
            <thead>
              <tr>
                <th class="th-sort" data-sort="login">Usuário <span class="sort-arrow"></span></th>
                <th class="th-sort" data-sort="criado_por">Criado por <span class="sort-arrow"></span></th>
                <th class="th-sort" data-sort="criado_por_nivel">Nível <span class="sort-arrow"></span></th>
                <th class="th-sort" data-sort="status">Status <span class="sort-arrow"></span></th>
                <th class="th-sort" data-sort="expira">Expiração <span class="sort-arrow"></span></th>
                <th>Limite</th>
                <th>Online há</th>
              </tr>
            </thead>
            <tbody id="users-tbody">
              <tr><td colspan="7" style="text-align:center; padding:32px; color:var(--muted);">Carregando…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>
<script src="/js/painel.js"></script>
<script>
let _allUsers = [];
let _sortKey = null, _sortDir = 1;

function fmtDuration(sec) {
  if (!sec) return "–";
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  return h > 0 ? `${h}h${String(m).padStart(2,"0")}min` : `${m}min`;
}

function levelLabel(u) {
  if (u.criado_por_nivel === "admin") return `<span class="badge badge-muted">Admin</span>`;
  if (u.criado_por_nivel === 2) return `<span class="badge badge-warn">Nível 2</span>`;
  if (u.criado_por_nivel === 3) return `<span class="badge badge-danger">Nível 3</span>`;
  return "–";
}

async function loadAll() {
  const data = await api("/users/all");
  if (!data) return;
  _allUsers = data;
  render();
}

function sortList(list) {
  if (!_sortKey) return list;
  return [...list].sort((a, b) => {
    let va, vb;
    if (_sortKey === "status") {
      const rank = u => u.blocked ? 3 : u.expired ? 2 : u.online ? 1 : 0;
      va = rank(a); vb = rank(b);
    } else {
      va = (a[_sortKey] ?? "").toString().toLowerCase();
      vb = (b[_sortKey] ?? "").toString().toLowerCase();
    }
    if (va < vb) return -1 * _sortDir;
    if (va > vb) return 1 * _sortDir;
    return 0;
  });
}

document.querySelectorAll(".th-sort").forEach(th => {
  th.style.cursor = "pointer";
  th.addEventListener("click", () => {
    const key = th.dataset.sort;
    if (_sortKey === key) { _sortDir *= -1; } else { _sortKey = key; _sortDir = 1; }
    document.querySelectorAll(".th-sort .sort-arrow").forEach(a => a.textContent = "");
    th.querySelector(".sort-arrow").textContent = _sortDir === 1 ? "▲" : "▼";
    render();
  });
});

function render() {
  const search = document.getElementById("filter-search").value.toLowerCase();
  const status = document.getElementById("filter-status").value;

  let list = _allUsers.filter(u => {
    if (search && !u.login.toLowerCase().includes(search) && !(u.criado_por||"").toLowerCase().includes(search)) return false;
    if (status === "online"  && !u.online)  return false;
    if (status === "expired" && !u.expired) return false;
    if (status === "blocked" && !u.blocked) return false;
    if (status === "active"  && (u.expired || u.blocked)) return false;
    return true;
  });

  list = sortList(list);
  document.getElementById("user-count").textContent = `${list.length} usuário(s)`;

  const tbody = document.getElementById("users-tbody");
  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--muted)">Nenhum usuário encontrado</td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(u => {
    const statusBadge = u.blocked
      ? `<span class="badge badge-danger">Bloqueado</span>`
      : u.expired
        ? `<span class="badge badge-warn">Expirado</span>`
        : u.online
          ? `<span class="badge badge-success">Online</span>`
          : `<span class="badge badge-muted">Ativo</span>`;
    return `<tr>
      <td><strong class="text-mono">${u.login}</strong></td>
      <td class="text-sm">${u.criado_por}</td>
      <td>${levelLabel(u)}</td>
      <td>${statusBadge}</td>
      <td class="text-sm ${u.expired ? 'text-muted' : ''}">${fmtDate(u.expira)}</td>
      <td>${u.limite}</td>
      <td class="text-sm">${u.online ? fmtDuration(u.online_seconds) : "–"}</td>
    </tr>`;
  }).join("");
}

document.getElementById("filter-search").addEventListener("input", render);
document.getElementById("filter-status").addEventListener("change", render);

initPage();
loadAll();
setInterval(loadAll, 20000);
</script>
</body>
